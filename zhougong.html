<script>

function s(){
var kw=document.getElementById("k").value.trim();
if(!kw)return;
var ms=[];
for(var k in D){if(kw.indexOf(k)>=0)ms.push(k)}
if(ms.length===0){document.getElementById("r").innerHTML="<p>未匹配到关键词，试试：蛇、鱼、龙、水、飞、钱、房子</p>";return}
if(ms.length===1){
var d=D[ms[0]];
var h="<h3>"+ms[0]+" (吉"+d.ji+"分)</h3><p>"+d.o+"</p>";
h+="<p><b>单身：</b>"+d.g.d+"<br><b>恋爱：</b>"+d.g.l+"<br><b>职场：</b>"+d.g.w+"</p>";
h+="<p><b>建议：</b>"+d.a+"</p><p style=color:green>"+d.y+"</p><p style=color:red>"+d.j+"</p>";
document.getElementById("r").innerHTML=h;
}else{
var h="<p>你的描述涉及多个梦境关键词：</p>";
for(var i=0;i<Math.min(ms.length,6);i++){h+="<p style=cursor:pointer onclick=\"document.getElementById('k').value='"+ms[i]+"';s()\"><b>"+ms[i]+"</b> - "+D[ms[i]].o.substring(0,40)+"...</p>"}
document.getElementById("r").innerHTML=h;
}
}
